services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs -d labs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://labs:labs@postgres:5432/labs
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://api:8000
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m workers.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://labs:labs@postgres:5432/labs
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  user-bot:
    build: .
    command: python -m bot.user_bot
    env_file: .env
    environment:
      BASE_URL: http://api:8000
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
    profiles:
      - bots

  admin-bot:
    build: .
    command: python -m bot.admin_bot
    env_file: .env
    environment:
      BASE_URL: http://api:8000
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
    profiles:
      - bots

volumes:
  pgdata:
